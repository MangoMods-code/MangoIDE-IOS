name: MangoIDE
options:
  bundleIdPrefix: com.mangomods
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_BITCODE: "NO"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  Unrar:
    url: https://github.com/mtgto/Unrar.swift
    exactVersion: "0.5.4"

targets:
  MangoIDE:
    type: application
    platform: iOS
    sources:
      - path: MangoIDE
    dependencies:
      - package: ZIPFoundation
      - package: Unrar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangomods.mangoide
        PRODUCT_NAME: MangoIDE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MangoIDE/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: MangoIDE/Info.plist
      properties:
        CFBundleDisplayName: MangoIDE
        CFBundleName: MangoIDE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Source Code
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.source-code
              - public.script
              - public.text
              - public.plain-text
              - public.json
              - public.xml
              - public.html
              - net.daringfireball.markdown
              - public.zip-archive
              - com.rarlab.rar-archive
              - public.data
