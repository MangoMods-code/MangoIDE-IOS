# Runs every bundled project template so a broken one never ships.
# Swift templates are compiled with the same Swift version the runner server uses.
name: Test templates

on:
  push:
    paths:
      - "templates/**"
      - "tools/**"
      - "MangoIDE/Run/RunService.swift"
      - ".github/workflows/templates.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Build and run every template
        run: python3 tools/build_templates.py --test
